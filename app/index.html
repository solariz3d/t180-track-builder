<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-180 Track Builder</title>
<style>
  /* SIGIL (2026-10-14): elegant minimalism with an esoteric-techno feel. Black and bone, hairline borders, ONE accent (pale ultraviolet); the warning
     colours stay their own hues so a red still reads as a red. Display type is Bahnschrift (on every Windows, already the dashboard's), numbers are
     Cascadia Mono; nothing is fetched, the app runs offline. Every colour below is a token: a panel never names a hue of its own. */
  :root {
    --bg: #060606; --panel: #0b0b0a; --raise: #121211; --line: #24221f; --hair: rgba(235, 230, 220, .14);
    --text: #ebe6dc; --dim: #8a847a; --accent: #b9a8ff; --accent-dim: rgba(185, 168, 255, .16);
    --mine: #d9a55a; --bad: #e0573f; --warn: #e3b448; --ok: #8fc9a2;
    --display: Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    --body: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  /* The page never scrolls: the grid fills the window exactly, and each side panel scrolls inside itself. (At the
     default 1400×860 window the page used to scroll: grid rows sized to content push the body past the window.) */
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 300 13px/1.45 var(--body); letter-spacing: .01em; }
  ::selection { background: var(--accent-dim); color: var(--text); }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); } ::-webkit-scrollbar-track { background: transparent; }
  /* Two columns: the controls on the left, the preview takes the rest. The validation panel (design speed, CSP wall
     raycasting, the load graph) and the other side sections sit under the builder's controls in the left column (#left);
     a third column for them took 300 px from the preview to hold one short panel (the keeper, 2026-10-03). */
  body { display: grid; grid-template-columns: 320px minmax(0, 1fr); grid-template-rows: 44px auto minmax(0, 1fr); height: 100vh; }
  header { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  header h1 { font: 300 13px var(--display); margin: 0 14px 0 2px; letter-spacing: .42em; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
  header h1::before { content: ""; width: 14px; height: 14px; border: 1px solid var(--text); border-radius: 50%; background: radial-gradient(circle, var(--accent) 0 16%, transparent 18%); flex: none; }
  header input, header select { background: transparent; color: var(--text); border: 1px solid var(--hair); border-radius: 2px; padding: 5px 8px; font: inherit; }
  header label { color: var(--dim); white-space: nowrap; }
  /* THE TITLE BAR (2026-10-14): the Windows frame is off, so the header is the bar (app/titlebar.js). Hairline glyphs, no fills. */
  header { padding-right: 0; user-select: none; }
  header .drag { flex: 1 1 0; align-self: stretch; min-width: 24px; }
  #winctl { display: flex; align-self: stretch; margin-left: 8px; }   /* D355: at least 8 px clear of Export to Assetto Corsa */
  #winctl button { width: 46px; height: 100%; border: 0; border-radius: 0; background: transparent; padding: 0; position: relative; cursor: default; }
  #winctl button::before, #winctl button::after { content: ""; position: absolute; left: 50%; top: 50%; box-sizing: border-box; }
  #win-min::before { width: 10px; height: 0; border-top: 1px solid var(--text); transform: translate(-50%, -50%); }
  #win-max::before { width: 10px; height: 10px; border: 1px solid var(--text); transform: translate(-50%, -50%); }
  #win-max.restore::before { width: 8px; height: 8px; transform: translate(-35%, -65%); }
  #win-max.restore::after { width: 8px; height: 8px; border: 1px solid var(--text); background: var(--panel); transform: translate(-65%, -35%); }
  #win-close::before, #win-close::after { width: 13px; height: 0; border-top: 1px solid var(--text); }
  #win-close::before { transform: translate(-50%, -50%) rotate(45deg); }
  #win-close::after { transform: translate(-50%, -50%) rotate(-45deg); }
  #win-min:hover, #win-max:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  #win-close:hover { background: #b0303a; }
  #win-close:hover::before, #win-close:hover::after { border-color: #fff; }
  /* A QUESTION IN THE PAGE (app/askdialog.js): the save-on-close prompt, in the same black, bone and violet. */
  .ask-veil { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgba(6, 6, 6, .62); backdrop-filter: blur(3px); }
  .ask-card { width: min(380px, calc(100vw - 48px)); background: var(--bg); border: 1px solid var(--hair); border-top: 1px solid var(--accent); padding: 22px 24px 18px; box-shadow: 0 18px 60px rgba(0, 0, 0, .6); }
  .ask-card h2 { margin: 0 0 10px; font: 300 12px var(--display); letter-spacing: .32em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .ask-card h2::before { content: ""; width: 10px; height: 10px; border: 1px solid var(--text); border-radius: 50%; background: radial-gradient(circle, var(--accent) 0 18%, transparent 20%); flex: none; }
  .ask-card p { margin: 0 0 20px; color: var(--dim); }
  .ask-row { display: flex; gap: 8px; justify-content: flex-end; }
  .ask-row .ask-quiet { margin-right: auto; color: var(--dim); }
  .ask-row .ask-main { border-color: var(--accent); color: var(--accent); }
  .ask-row button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  /* D361: File ▸ Export layouts… (app/menubar/layoutsdialog.js) */
  .author-row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 4px 10px; }
  .author-row input { min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--hair); border-radius: 2px; padding: 3px 5px; }
  .ask-card.ask-layouts { width: min(680px, calc(100vw - 48px)); }
  .ask-layouts .lx-row { display: grid; grid-template-columns: 40px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.4fr) 40px; align-items: center; gap: 8px; margin: 0 0 6px; }
  .ask-layouts label.lx-row { grid-template-columns: 110px minmax(0, 1fr); margin-bottom: 14px; }
  .ask-layouts .lx-head span { color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .ask-layouts .lx-track { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ask-layouts input[type="text"] { min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--hair); border-radius: 2px; padding: 3px 5px; }
  .ask-layouts .lx-problem { min-height: 1.2em; color: var(--accent); margin: 10px 0 14px; }
  #banner { grid-column: 1 / -1; }
  #banner:empty { display: none; }
  /* D252: the drop-down menu (it was the ⋯ menu; D355: every menu on the top bar is one): it drops down over the page */
  .more { position: relative; }
  .more > summary { list-style: none; cursor: pointer; background: transparent; border: 1px solid var(--hair); border-radius: 2px; padding: 5px 10px; }
  .more > summary::-webkit-details-marker { display: none; }
  .more[open] > summary { border-color: var(--accent); }
  .more-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 30; display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px; min-width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .more-menu > span { display: flex; flex-direction: column; gap: 6px; }
  .pieces-menu .more-menu { width: 420px; max-height: 70vh; overflow-y: auto; }   /* D269: the saved pieces, a bin under the top bar (D355: it opens leftwards, as every menu at the top right does) */
  /* D355: THE MENUS (app/menubar/menubar.js), each the same <details class="more"> + .more-menu as Pieces ▾. Inside one: a heading is the page's h3, a hairline
     is the panel's line colour, and a tick is laid out as the sound row's mute */
  header .more > summary { white-space: nowrap; }   /* a menu's name and its ▾ stay on one line in the 44 px bar */
  /* D355: THE BAR FITS at the default 1400 px: the menus and Export to Assetto Corsa never wrap; the status line and the install note beside Export give way first
     (cut to their box, the whole text in the tooltip), and the gap between the two halves shrinks to nothing before anything wraps */
  header > * { flex: none; }
  header #status { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .drag { min-width: 0; }
  /* #install shrinks only as far as its button: the note's column has no minimum (minmax(0, max-content)), so the note gives way first and the button never runs under
     the window buttons (as a flex row, the note's whole one-line text counted toward the box's minimum width and pushed the bar 108 px past 1400) */
  header #install { flex: 0 1 auto; display: grid; grid-template-columns: auto minmax(0, max-content); align-items: center; column-gap: 8px; }
  header #install > button { white-space: nowrap; flex: none; }
  /* D355: THE BRUSH STRIP under the bar (C's panel builds it as .brush-strip and shows it only while the brush is on; the page moves it into the banner row): its
     fields run along one row, in the page's raised panel colour with a hairline under it, as the recovery bar is laid out */
  #banner .brush-strip { padding: 6px 12px; background: var(--raise); border-bottom: 1px solid var(--line); }
  #banner .brush-strip .pickers { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
  #banner .brush-strip .picker { grid-template-columns: auto auto; }
  .more-menu h3 { margin: 6px 0 0; }
  .more-menu hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
  .more-menu .menu-check { display: flex; align-items: center; gap: 6px; padding: 2px 2px; color: var(--text); white-space: nowrap; cursor: pointer; }
  .more-menu .menu-slot, .more-menu .menu-panel-wrap, .more-menu .menu-panel { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .more-menu .menu-slot:empty { display: none; }
  .pieces-menu .piece-row:hover { background: rgba(255,255,255,0.05); }
  .more-menu #share { display: flex; flex-direction: column; gap: 6px; }   /* D267: the share codes live in the menu (they were a section of the left column) */
  .more-menu #share textarea { width: 100%; box-sizing: border-box; }
  /* D252 follow-up (C's finding 2): a long install note (the full Assetto Corsa path) pushed ⋯ right and its menu off the window; it is cut to a box, the whole text in its tooltip */
  .t-install-note { display: inline-block; vertical-align: middle; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }   /* D355: in the bar it gives way before anything wraps */
  .bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--raise); border-bottom: 1px solid var(--mine); }
  button { background: transparent; color: var(--text); border: 1px solid var(--hair); border-radius: 2px; padding: 5px 11px; cursor: pointer; font: 400 12px var(--body); letter-spacing: .06em; transition: border-color .12s, color .12s; }
  button:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
  button:active:not([disabled]) { background: var(--accent-dim); }
  input, select, textarea { font: inherit; }
  input[type="number"], input[type="text"], input:not([type]), textarea { background: transparent; color: var(--text); border: 1px solid var(--hair); border-radius: 2px; padding: 4px 7px; }
  input[type="number"] { font-family: var(--mono); font-size: 12px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
  input[type="checkbox"], input[type="radio"], input[type="range"] { accent-color: var(--accent); }
  select { background: var(--bg); color: var(--text); }
  .sound-row { display: flex; align-items: center; gap: 10px; padding: 4px 2px; color: var(--dim); }
  .sound-row label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sound-row input[type="range"] { flex: 1; min-width: 90px; accent-color: var(--accent); }
  /* THE OPEN LISTS IN THE SIGIL LOOK (2026-10-14): every list that drops open is black with its names in white, the chosen one in the accent */
  option { background: var(--bg); color: var(--text); }
  option:checked { background: var(--accent-dim); color: #fff; }
  /* the header's two lists (Open, Previous versions) as a full Sigil panel: Chromium's customizable select (WebView2 135 and later; an older runtime keeps the colours above) */
  @supports (appearance: base-select) {
    header select, header select::picker(select) { appearance: base-select; }
    header select { background: transparent; min-width: 150px; }
    header select::picker-icon { color: var(--dim); transition: rotate .15s; }
    header select:open::picker-icon { rotate: 180deg; color: var(--accent); }
    header select::picker(select) { background: var(--bg); border: 1px solid var(--hair); border-top: 1px solid var(--accent); border-radius: 2px; padding: 4px 0;
      margin-top: 4px; max-height: min(70vh, 560px); min-width: max(anchor-size(width), 260px); box-shadow: 0 18px 50px rgba(0, 0, 0, .65); }
    header select option { background: transparent; color: #fff; padding: 7px 14px; font: 300 13px var(--body); letter-spacing: .03em; border-left: 2px solid transparent; }
    header select option:first-of-type { color: var(--dim); font: 300 11px var(--display); letter-spacing: .3em; text-transform: uppercase; }
    header select option:hover, header select option:focus-visible { background: color-mix(in srgb, var(--accent) 14%, transparent); border-left-color: var(--accent); outline: none; }
    header select option:checked { background: transparent; color: var(--accent); }
    header select option::checkmark { content: "\25CF"; order: 1; margin-left: auto; font-size: 7px; color: var(--accent); }
    header select option:first-of-type::checkmark { content: ""; }
  }
  button[disabled] { opacity: .4; cursor: default; }
  /* The left column scrolls as ONE (up and down only): #palette and #side take their natural height inside it */
  /* Both columns sit in the window-filling third row by name. Auto-placed, they slid up into the banner's content-sized
     row whenever the banner was empty (display: none takes it out of the grid). */
  #left, #stage { grid-row: 3; }
  /* SIGIL LAYOUT (2026-10-14): the 3D view takes the whole area under the top bar; the controls FLOAT over it (#left, a hairline panel on the left; the camera
     bar, a dock along the bottom), so the track is the page and the tools sit on it. Same panels, same order, nothing moved in the DOM. */
  #stage { grid-column: 1 / -1; }
  #left #palette, #left #side { background: transparent; }
  #left { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; background: rgba(8, 8, 7, .84); border: 1px solid var(--hair);
    grid-column: 1; position: relative; z-index: 10; margin: 12px 0 12px 12px; align-self: start; max-height: calc(100% - 24px); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }   /* SIGIL: floats over the preview */
  #palette, #side { flex: none; background: var(--panel); }
  #palette { padding: 10px; }
  #stage { position: relative; display: grid; grid-template-rows: minmax(0, 1fr); min-width: 0; min-height: 0; }
  #preview { position: relative; min-height: 0; overflow: hidden; }
  #camera { position: absolute; z-index: 9; left: 346px; right: 16px; bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  #camera > * { pointer-events: auto; }
  #camera [role="toolbar"] { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; padding: 5px 8px; background: rgba(8, 8, 7, .78); border: 1px solid var(--hair); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #camera [role="toolbar"] button { border-color: transparent; text-transform: uppercase; letter-spacing: .22em; font-size: 10.5px; padding: 6px 10px; }
  #camera [role="toolbar"] button[aria-pressed="true"], #camera [role="toolbar"] button.on { color: var(--accent); box-shadow: 0 -1px 0 var(--accent) inset; }
  /* the depth behind the track: a soft vignette over the view (the road keeps its own lighting) */
  #preview::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 55% 38%, transparent 55%, rgba(0, 0, 0, .55) 100%); }
  .preview-hud { z-index: 2; left: 346px !important; top: 14px; bottom: auto !important; background: transparent !important; font-family: var(--mono) !important; font-size: 10.5px !important; letter-spacing: .14em; text-transform: uppercase; }
  #camera p { margin: 0; color: var(--dim); font-size: 11px; letter-spacing: .04em; text-shadow: 0 0 6px #000; }
  /* The side sections never scroll sideways (seen at the default window size once E's 480 px load graph showed): what a
     panel puts here is held to the column's width. Canvases, images and tables shrink to fit, long words break, and the
     vertical scrollbar's width is reserved up front so it cannot push content sideways when it appears. */
  #side { border-top: 1px solid var(--line); overflow-x: hidden; }   /* the scrollbar gutter is #left's: only the column scrolls */
  #side > section { padding: 10px; border-bottom: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
  #side canvas, #side img, #side svg, #side video { display: block; max-width: 100%; height: auto; }
  #side table { display: block; max-width: 100%; overflow-x: auto; }
  #reds:empty { display: none; }
  h3 { font: 400 12px var(--display); text-transform: uppercase; letter-spacing: .34em; color: var(--dim); margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
  h3::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
  .pickers { display: grid; gap: 6px; }
  /* D235 (the keeper's screenshot: the Extend fields ran under the scroll bar, and the "width like…" select was cut off): the field column is minmax(0, 1fr), not 1fr,
     so it can shrink below what an input or a select would like (a 1fr track will not go under its items' min-content, which is how the Extend rows grew to 65 px past the
     column's content box at 1818 px); and every field in a row is held to its track, whatever its own intrinsic width. */
  .picker { display: grid; grid-template-columns: 60px minmax(0, 1fr); align-items: center; gap: 6px; }
  .picker input:not([type="checkbox"]):not([type="radio"]), .picker select { min-width: 0; max-width: 100%; box-sizing: border-box; }
  .picker select { background: var(--bg); color: var(--text); border: 1px solid var(--hair); border-radius: 2px; padding: 3px; }
  .picker > span, .picker > label { color: var(--dim); font-size: 12px; }
  .pieces { display: flex; flex-wrap: wrap; gap: 6px; }
  .piece.mine { border-color: var(--mine); color: var(--mine); }
  .piece.suggested { border-color: var(--accent); }
  .next { color: var(--dim); margin-bottom: 8px; font-size: 12px; }
  .actions, .save-piece { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .save-piece input { flex: 1; min-width: 0; background: transparent; color: var(--text); border: 1px solid var(--hair); border-radius: 2px; padding: 4px 6px; }
  .track { list-style: none; padding: 0; margin: 0; max-height: 30vh; overflow: auto; font-family: var(--mono); font-size: 12px; }
  .track li { padding: 2px 6px; border-radius: 3px; cursor: pointer; }
  .track li.selected { background: var(--accent-dim); color: var(--accent); }
  .head { color: var(--dim); margin-bottom: 8px; }
  .message, .panel-error { color: var(--bad); white-space: pre-wrap; }
  .message.ok { color: var(--text); }
  .panel-error { margin: 12px; }
  .empty { color: var(--dim); margin: 0; }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); text-align: center; padding: 20px; }
  .reds li { margin: 3px 0; }
  .reds .src { color: var(--dim); }
</style>
</head>
<body>
<header data-tauri-drag-region>
  <h1 data-tauri-drag-region>T-180 TRACK BUILDER</h1>
  <input id="name" placeholder="track name" aria-label="track name" size="16">
  <span id="status" style="color: var(--dim)" data-tauri-drag-region></span>
  <span class="drag" data-tauri-drag-region></span>
  <!-- D355: THE MENUS, each the page's <details class="more"> drop-down (app/menubar/menubar.js fills the .menu-slot ones as they open) -->
  <details id="m-file" class="more"><summary title="new, open, save, previous versions, export, See it in Assetto, the track codes">File ▾</summary><div class="more-menu">
    <button id="new" title="New track">New</button>
    <select id="open" aria-label="open a saved track"><option value="">Open…</option></select>
    <button id="save" title="Ctrl+S">Save</button>
    <select id="versions" aria-label="previous versions of the open track" title="Every Save keeps the version it replaces (the newest 20), and Close the loop keeps the track from before it. One opens as an unsaved copy."><option value="">Previous versions…</option></select>
    <hr>
    <button id="export" title="Write an Assetto Corsa track folder into a folder you pick. Nothing is installed or launched.">Export…</button>
    <button id="testexport" title="TEST export of an UNFINISHED track into Assetto Corsa, as t180b_&lt;name&gt;_test, to drive it by hand: the loop may be open, reds are listed as warnings (not blocking), the road ends in a wall after a run-off, and the track is named (test, unfinished). Never a finished export. Export to Assetto Corsa does the same on an open track.">Test export (unfinished)…</button>
    <button id="exportlayouts" title="Two or more saved tracks as ONE Assetto Corsa track with one layout each (the way track N ships its layouts): you name each layout and mark the main one. Re-exporting removes the files of a layout you leave out, and nothing else. Nothing is installed or launched.">Export layouts…</button>
    <span id="more-install"></span>
    <hr>
    <div id="share" title="the whole track as one line of text to share (Copy track code), or open a track from such a line (Paste track code…). The open track is one Ctrl+Z away"></div>
    <div class="menu-slot" id="m-file-slot"></div>
  </div></details>
  <details id="m-edit" class="more"><summary title="undo, redo, and what to do with the selected pieces">Edit ▾</summary><div class="more-menu"><div class="menu-slot" id="m-edit-slot"></div></div></details>
  <details id="m-build" class="more"><summary title="pieces with a purpose: straight, level, to the floor, turns, a sharp corner, a jump; the brush; close the loop">Build ▾</summary><div class="more-menu"><div class="menu-slot" id="m-build-slot"></div></div></details>
  <details id="m-track" class="more"><summary title="the whole track: start and grid, pit lane, road surface">Track ▾</summary><div class="more-menu"><div class="menu-slot" id="m-track-slot"></div></div></details>
  <details id="pieces" class="more pieces-menu"><summary title="your saved pieces: click one to add it at the head of the track; also mirrored, rename, delete">Pieces ▾</summary><div class="more-menu" id="pieces-bin"></div></details>
  <details id="m-view" class="more"><summary title="what the view shows: the drag handles, the track coloured by grip, the guide">View ▾</summary><div class="more-menu"><div class="menu-slot" id="m-view-slot"></div></div></details>
  <details id="m-settings" class="more"><summary title="sound, how the turn and climb are read, the grid step, the checker, the Assetto Corsa folder; kept from one start to the next">Settings ▾</summary><div class="more-menu"><div class="menu-slot" id="m-settings-slot">
    <div id="sound-row" class="sound-row" title="the builder's sounds: a tick while a handle is dragged, placing a piece, undo, and closing the loop. Sounds by solariz3d, made in Serum"><label><input type="checkbox" id="sound-mute"> mute</label><input type="range" id="sound-volume" min="0" max="100" step="1" aria-label="sound volume"></div>
  </div></div></details>
  <span id="install" title="Export to Assetto Corsa writes into Assetto Corsa's content\tracks (found through Steam), always as a t180b_ folder"></span>
  <div id="winctl" hidden><button id="win-min" title="Minimize" aria-label="Minimize"></button><button id="win-max" title="Maximize" aria-label="Maximize"></button><button id="win-close" title="Close" aria-label="Close"></button></div>
</header>
<div id="banner"></div>
<div id="left">
  <aside id="palette"></aside>
  <aside id="side">
    <section id="reds"></section>
    <section id="validation"></section>
    <section id="textures"></section>
  </aside>
</div>
<main id="stage">
  <div id="preview"><div class="placeholder">Loading the preview…</div></div>
  <div id="camera"></div>
  <div id="guide" style="position: absolute; inset: 0; pointer-events: none; z-index: 5;"></div>
</main>
<script src="lib/cjs.js"></script>
<script>
'use strict';
// The page's glue: storage and export through the native side, the equation builder (app/core), the keys, the recovery offer, and
// the panels (app/README.md, "The seam"). Nothing here edits a document: every action is the shell's. D239 (the keeper: "can we keep
// only the equation mode?"): the Pieces builder and its switch are gone; its share codes, Install to AC / See it in Assetto, autosave
// with crash restore and the getting-started guide are carried onto this page, each working on the equation track.
(async () => {
  const $ = (id) => document.getElementById(id), status = $('status');
  // Served from src-tauri/dist, which mirrors the repository: this page is app/index.html, the program is ../src/.
  const get = (p) => fetch(`../${p}`).then((r) => { if (!r.ok) throw new Error(`${r.status} ${p}`); return r.text(); });
  const tauri = window.__TAURI__ && window.__TAURI__.core;
  const call = (cmd, args) => (tauri ? tauri.invoke(cmd, args) : Promise.reject(new Error('not running inside the app: no native side')));
  const b64 = (bytes) => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
  // the page's LOCAL time as yyyy-mm-dd_hhmmss: a backup's name (src-tauri/src/backups.rs checks the form; the keeper reads it)
  const localStamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };
  const storage = {
    saveDoc: (name, text) => call('save_track', { name, text, stamp: localStamp() }),   // D239 amendment: the file it overwrites is moved to track-backups first
    backupDoc: (name, text) => call('backup_track', { name, text, stamp: localStamp() }),
    listBackups: (name) => (tauri ? call('list_track_backups', { name }) : Promise.resolve([])),
    openBackup: (file) => call('open_track_backup', { file }),
    openDoc: (name) => call('open_track', { name }),
    saveUndo: (name, text) => (tauri ? call('save_undo', { name, text }) : Promise.resolve()),   // D272: the track's undo history, beside it (eq-<name>.t180undo; src-tauri/src/lib.rs)
    openUndo: (name) => (tauri ? call('open_undo', { name }) : Promise.resolve(null)),
    listDocs: () => call('list_tracks'),
    // D240, saved pieces: one <name>.t180piece each in the app's pieces folder (src-tauri/src/lib.rs); a name already used is refused natively, never overwritten
    listPieces: () => (tauri ? call('list_pieces') : Promise.resolve([])),
    openPiece: (name) => call('open_piece', { name }),
    savePiece: (name, text) => call('save_piece', { name, text }),
    deletePiece: (name) => call('delete_piece', { name }),
    saveLibrary: (text) => call('save_library', { text }),
    openLibrary: () => (tauri ? call('open_library') : Promise.resolve(null)),
    saveAutosave: (text) => (tauri ? call('save_autosave', { text }) : Promise.resolve()),
    openAutosave: () => (tauri ? call('open_autosave') : Promise.resolve(null)),
    clearAutosave: () => (tauri ? call('clear_autosave') : Promise.resolve()),
    writeExport: (dir, folder, files) => call('write_export', { dir, folder, files: files.map((f) => ({ path: f.path, data: b64(f.bytes) })) }),
    // D361: File ▸ Export layouts…, the same write, then what the folder's previous marker listed and this export does not write is removed (src-tauri/src/lib.rs)
    writeLayouts: (dir, folder, files) => call('write_layouts_export', { dir, folder, files: files.map((f) => ({ path: f.path, data: b64(f.bytes) })) }),
    folderIsEmpty: (dir) => call('folder_is_empty', { dir }),   // D226: only an EMPTY folder directly in content\tracks, not t180b_*, reads true
    removeEmptyFolder: (dir) => call('remove_empty_folder', { dir }),   // and only that one can be removed (rmdir: never its contents)
  };

  // THE WINDOW'S X (D192). ONE close handler, registered here before the builder starts (app/closer.js says why: a script close listener
  // makes Tauri wait for destroy(), and the listener registry outlives a page reload, so a handler whose callback is gone would trap the
  // window). The handler cleans up through closeCleanup (the builder sets it), never lets an error or a hang stand in its way, and ends in
  // destroy(). If the module cannot load, a bare handler that only destroys is registered, so a stale listener can still not trap the window.
  let closeCleanup = null;
  // UNSAVED WORK (the keeper, 2026-10-03): the builder sets closeDirty to "is there unsaved work?"; the X then asks Save / Don't
  // save / Cancel. Save is the Save button's own path; if the work is still unsaved after it (no name yet), the window stays
  // open with the name field focused. No dialog API (off Tauri) or a failing one: close as before (app/closer.js).
  let closeDirty = null;
  const closeAsk = async () => {
    if (typeof closeDirty !== 'function' || !closeDirty()) return null;
    if (!tauri) return null;
    // 2026-10-14, Sigil: asked inside the page in the builder's own look (app/askdialog.js), no longer a native Windows box.
    // A failure to ask throws, and app/closer.js then closes as before (a broken prompt must not trap the window).
    const { askChoice } = await loadCjs('app/askdialog.js', get);
    return askChoice(document, { title: 'Save before closing?', message: 'This track has changes that are not saved.', cancelValue: 'cancel',
      buttons: [{ label: "Don't save", value: 'discard', kind: 'quiet' }, { label: 'Cancel', value: 'cancel' }, { label: 'Save', value: 'save', kind: 'main', default: true }] });
  };
  // D234 (the keeper read the outcome of a refused export from Content Manager, not from the app): a refused or failed export is also an ALERT, a native error dialog,
  // besides the red box and the status line. Not when the page's test seam answered the folder (an automated drive must not wait on a dialog).
  const notExportedAlert = async (st, seam) => {
    if (seam || !tauri || !st.exportRefusal || st.exportRefusal !== st.message) return;
    try { await call('plugin:dialog|message', { message: st.exportRefusal, title: 'Not exported', kind: 'error' }); } catch (e) { /* the red box shows it too */ }
  };
  const closeSave = async () => {
    await $('save').onclick();
    if (closeDirty()) { $('name').focus(); status.textContent = 'Type a name for the track, then save or close again.'; return false; }
    return true;
  };
  const win = window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow && window.__TAURI__.window.getCurrentWindow();
  try {
    const registered = (await loadCjs('app/closer.js', get)).installCloseHandler(win, () => closeCleanup, { ask: closeAsk, save: closeSave });
    if (registered && registered.catch) registered.catch((e) => console.error(`close handler not registered: ${e && e.message}`));
  } catch (e) {
    if (win && win.onCloseRequested) win.onCloseRequested(async (ev) => { ev.preventDefault(); try { await win.destroy(); } catch (err) { /* nothing more to try */ } });
  }
  // the title bar AFTER the close handler, so its X always has a handler to reach (app/titlebar.js)
  try { await (await loadCjs("app/titlebar.js", get)).wireTitlebar(document, win); } catch (e) { console.error(`title bar not wired: ${e && e.message}`); }

  // ONE BUILDER (D239): the EQUATION TRACK (app/core, src/core). The Pieces builder (D186's second mode, ?mode=pieces, the t180.mode
  // setting) is removed; the word tracks it saved stay on disk in the app's tracks folder (app/README.md says where), never deleted.
  await startCore();

  async function startCore() {
    let C, panels, shell, exporter, coreOpts, RG, authorNow = () => '';
    try {
      // the core's modules reach tools/piecewise.cjs (its solver), whose command-line half requires fs and path: they are given
      // the exporter's in-memory node shim, so they load and nothing touches the disk (the core calls only the solver)
      const shim = (await loadCjs('app/export/node-shim.js', get)).createShim();
      coreOpts = { builtins: shim.builtins, globals: { Buffer: shim.Buffer } };   // also the share panel's: a pasted code is parsed by the core (D239)
      C = await loadCjs('app/core/coreshell.js', get, coreOpts);
      panels = await loadCjs('app/palette/panels.js', get);
      RG = await loadCjs('app/validate-ui/redgroups.js', get);   // D242: every red in plain words, grouped, with where
      // D365: every export (Export, Test export, Install) writes Settings ▸ Author name as the author, read at the moment of the export; if the
      // settings cannot load, there is no name and the export writes today's author (src/export/fromwords.js authorOf)
      try { const S0 = await loadCjs('app/settings.js', get), MI0 = await loadCjs('app/menubar/items.js', get); authorNow = () => MI0.authorName(S0); } catch (e) { console.error(`the author name could not start: ${e && e.message}`); }
      exporter = await (await loadCjs('app/export/export.js', get)).makeExporter(get, { author: () => authorNow() });
      // D240 follow-up: a preview's overlap check runs in a Web Worker (app/core/overlapworker.js), so the page never freezes for it; a page with no worker checks on the spot, as before
      let overlapRunner = null;
      try { overlapRunner = (await loadCjs('app/core/overlaprunner.js', get)).createWorkerRunner({ win: window }); } catch (e) { overlapRunner = null; }
      // 2026-10-15: Close works out its preview in a Web Worker too (app/core/closeworker.js), so the window never waits for it; a page with no worker closes on the spot, as before
      let closeRunner = null;
      try { closeRunner = (await loadCjs('app/core/closerunner.js', get)).createCloseRunner({ win: window }); } catch (e) { closeRunner = null; }
      shell = await C.createCoreShell({ storage, exporter, now: () => performance.now(), overlapRunner, closeRunner });
      closeDirty = () => !!shell.getState().dirty;   // the X asks to save unsaved work (closeAsk above)
    } catch (e) { $('palette').textContent = `The equation builder could not start: ${e.message}`; return; }
    const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
    // D228: the road surface of the core's track (app/core/textures.js announces the set; the preview draws it, the Export below writes it)
    let textureSet = null;
    document.addEventListener('t180:textures', (e) => { textureSet = e.detail ? e.detail.set : null; });
    const drawReds = (st) => {
      const r = $('reds'), refusal = st.exportRefusal && st.exportRefusal === st.message ? st.exportRefusal : null;   // only while it is still THE message: any later action clears it
      if (!st.exportReds && !refusal) { r.replaceChildren(); return; }
      if (!st.exportReds) { r.replaceChildren(el('h3', 'Not exported'), el('p', refusal, 'message')); return; }
      // D242: EVERY red, in plain words, grouped (the overlap first), with where: s in km and the piece; a click on a place moves the camera there
      const kids = [el('h3', 'Not exported: red on the track')];
      for (const g of RG.groupReds(st.exportReds, st.resolved.segments, { closed: st.resolved.closed })) {
        kids.push(el('p', `${g.title} (${RG.placesText(g)})`, 'message'));   // D248: one line per PLACE (overlapping or touching reds on one piece merged)
        const list = el('ul', null, 'reds');
        for (const it of g.places) { const li = el('li'), b = el('button', RG.placeText(it)); b.title = `${it.what}: show it`; b.onclick = () => document.dispatchEvent(new CustomEvent('t180-camera-focus', { detail: { s: it.s } })); li.append(b, ` ${it.what}${it.detail ? ` (${it.detail})` : ''}`); list.append(li); }
        kids.push(list);
      }
      r.replaceChildren(...kids);
    };
    // THE RECOVERY OFFER (D239, carried from the piece builder): a track the last session left unsaved is offered, never applied
    // D252: the banner row also carries the Assetto Corsa setup card's slot (app/install/index.js), kept across every redraw; empty, it takes no height
    const setupSlot = document.createElement('div'); setupSlot.id = 'setup';
    const brushSlot = document.createElement('div'); brushSlot.id = 'brush-slot';   // D355: the brush strip, under the bar (moved in after the core panel mounts)
    const drawBanner = (st) => {
      const b = $('banner');
      if (!st.recovery) { b.replaceChildren(setupSlot, brushSlot); return; }
      const n = st.recovery.doc.pieces.length, restore = el('button', 'Restore it'), discard = el('button', 'Discard it');
      restore.onclick = () => { const name = st.recovery.name; shell.restore(); if (name) $('name').value = name; };
      discard.onclick = () => shell.discardRecovery();
      const bar = el('div', null, 'bar');
      bar.append(el('span', `A track from your last session was not saved${st.recovery.name ? ` ("${st.recovery.name}")` : ''}: ${n} piece${n === 1 ? '' : 's'}${st.recovery.doc.closed ? ', a closed loop' : ''}.`), restore, discard);
      b.replaceChildren(bar, setupSlot, brushSlot);
    };
    const draw = (st) => { drawBanner(st); drawReds(st); status.textContent = `${st.name || 'unsaved'}${st.dirty ? ' •' : ''}${st.history.present.closed ? ' · closed loop' : ''}`; };
    shell.subscribe(draw); draw(shell.getState());
    // D340, THE LATE-INPUT LOG: each key event the preview handled late ('t180:input-late', app/preview/preview.js checkLate) is appended to input-late.log in
    // the app's data folder (src-tauri/src/lib.rs append_input_log, off the main thread, size-capped), buffered and written later, never on the key's path
    try {
      const inputLog = (await loadCjs('app/core/inputlog.js', get)).createInputLog({ write: (text) => (tauri ? call('append_input_log', { text }) : Promise.resolve()) });
      document.addEventListener('t180:input-late', (e) => { if (e.detail) inputLog.add(e.detail); });
    } catch (e) { console.error(`late-input log not wired: ${e && e.message}`); }
    // THE SOUNDS (app/sound.js): place, undo and loop closed are read off the shell's state; the drag tick comes from the handles. Mute and volume in the ⋯ menu
    try {
      const sound = (await loadCjs('app/sound.js', get)).createSound(window, { base: 'sounds/' });
      let before = shell.getState(); shell.subscribe((st) => { const p = before; before = st; sound.handle(p, st); });
      const mute = $('sound-mute'), vol = $('sound-volume');
      mute.checked = sound.muted; vol.value = String(Math.round(sound.volume * 100));
      mute.onchange = () => sound.setMuted(mute.checked);
      vol.oninput = () => sound.setVolume(Number(vol.value) / 100);
    } catch (e) { console.error(`sounds not started: ${e && e.message}`); }
    const refreshList = async () => { try { const names = await shell.list(); $('open').replaceChildren(new Option('Open…', ''), ...names.map((n) => new Option(n, n))); } catch (e) { status.textContent = e.message; } };
    $('new').onclick = () => shell.newDoc();
    $('save').onclick = async () => { try { await shell.save($('name').value.trim()); await refreshList(); } catch (e) { status.textContent = e.message; } };
    // PREVIOUS VERSIONS of the open track (D239 amendment): listed when the picker is opened, one opens as an unsaved copy
    const refreshVersions = async () => {
      const v = $('versions');
      try {
        const list = await shell.listVersions();
        v.replaceChildren(new Option(list.length ? `Previous versions (${list.length})…` : 'Previous versions: none yet', ''), ...list.map((b) => new Option(`${b.when || b.file}${b.length != null ? ` · ${Math.round(b.length).toLocaleString('en-US')} m` : ''}${b.closed != null ? (b.closed ? ' · closed' : ' · open') : ' · unreadable'}`, b.file)));
      } catch (e) { status.textContent = `previous versions: ${e.message || e}`; }
    };
    $('versions').onmousedown = $('versions').onfocus = () => { refreshVersions(); };
    $('versions').onchange = async (e) => { const f = e.target.value; if (!f) return; await shell.openVersion(f); $('name').value = ''; e.target.value = ''; };
    $('open').onchange = async (e) => { const n = e.target.value; if (!n) return; try { await shell.open(n); $('name').value = n; } catch (err) { status.textContent = err.message; } e.target.value = ''; };
    $('export').onclick = async () => {
      try {
        const seam = await call('test_export_folder'), dir = seam || await call('plugin:dialog|open', { options: { directory: true, multiple: false, title: 'Export the track into…' } });
        if (!dir) return;
        status.textContent = 'exporting…';
        await shell.exportTo(dir, { textures: textureSet });   // the self-intersection check is always on (app/export/export.js); the set is the road surface the preview draws (D228)
        await notExportedAlert(shell.getState(), seam);
      } catch (e) { status.textContent = `export failed: ${e.message || e}`; }
    };
    // D361: File ▸ Export layouts… (app/menubar/layoutsexport.js): two or more saved tracks as one AC track folder, a layout each. Its own copy of the exporter,
    // loaded with its own node shim, so it never touches the Export button's. If it cannot load, the button says why instead of doing nothing
    try {
      const lxShim = (await loadCjs('app/export/node-shim.js', get)).createShim();
      const layoutsSrc = await loadCjs('src/export/layouts.js', get, { builtins: lxShim.builtins, globals: { Buffer: lxShim.Buffer } });
      const LX = await loadCjs('app/menubar/layoutsexport.js', get), LD = await loadCjs('app/menubar/layoutsdialog.js', get);
      const lx = LX.createLayoutsExport({ C, layouts: layoutsSrc, shim: lxShim, storage });
      const pickLayoutsFolder = async (title) => (await call('test_export_folder')) || call('plugin:dialog|open', { options: { directory: true, multiple: false, title } });
      $('exportlayouts').onclick = async () => {
        try { await LX.exportLayoutsFlow({ lx, shell, ask: (tracks) => LD.askLayouts(document, { tracks }), pickFolder: pickLayoutsFolder, exporter, storage, say: (t) => { status.textContent = t; }, textures: textureSet, author: authorNow() }); }
        catch (e) { status.textContent = `export layouts failed: ${e.message || e}`; }
      };
    } catch (e) { const why = (e && e.message) || String(e); $('exportlayouts').onclick = () => { status.textContent = `Export layouts could not start: ${why}`; }; }
    // D243a: the TEST export of an unfinished track, its own button (never the default Export). D264: it goes into Assetto Corsa by the install's path
    // (app/install/index.js, mounted below with testButton), asking for the AC folder only when it is not known; Export… (any folder) is unchanged
    refreshList();
    // THE KEYS (D239 note: moved from app/shell.js, as they were): Ctrl+Z undo, Ctrl+Shift+Z or Ctrl+Y redo, Ctrl+S save, Ctrl+Backspace
    // removes the head (shell.removeHead, one undo step). If the module cannot load, the page says so instead of silently having no keys.
    try { (await loadCjs('app/core/keys.js', get)).bindKeys(document, shell, { save: () => $('save').click() }); }
    catch (e) { status.textContent = `the keyboard shortcuts could not start: ${e.message}`; }
    // A clean exit clears the autosave; a crash leaves it for the next start to offer back. The one close handler (above) runs this
    // inside its try: if it fails or hangs the window still closes, and the autosave is simply left for the next start (D239).
    closeCleanup = async () => { if (!shell.getState().dirty) await shell.cleanExit(); else await shell.flushAutosave(); };
    // the panels that read only the shared path (preview, camera, validation) are reused unchanged; the core's own controls take the
    // left column. Share codes, Install to AC / See it in Assetto and the guide are carried from the piece builder (D239).
    await panels.mountPanel($('palette'), 'equation track', () => loadCjs('app/core/index.js', get), shell);
    { const strip = document.querySelector('#palette .brush-strip'); if (strip) brushSlot.append(strip); }   // D355: C's brush strip goes under the bar; a panel without one leaves the slot empty
    for (const [dir, id] of [['preview', 'preview'], ['camera', 'camera'], ['validate-ui', 'validation']]) {
      await panels.mountPanel($(id), dir, () => loadCjs(`app/${dir}/index.js`, get), shell);
    }
    // last, so the preview is already listening when the road surface announces the asphalt default. D355: the road surface is the Track menu's (A's
    // app/core/trackmenu.js makes its one controller on its first items(ctx), called here, and its Road surface ▸ panel shows it); the old #textures mount is
    // only the fallback for a tree without that module, so there is never a second controller whose choice the other does not see
    let TM = null, tmError = null; try { TM = await loadCjs('app/core/trackmenu.js', get); } catch (e) { TM = null; tmError = (e && e.message) || String(e); }   // D356: the reason is kept for the Track menu
    if (TM && typeof TM.items === 'function') { $('textures').remove(); try { TM.items({ shell, document, window }); } catch (e) { console.error(`the road surface could not start: ${e && e.message}`); } }
    else await panels.mountPanel($('textures'), 'texture', () => loadCjs('app/core/textures.js', get), shell);
    // Share codes (an equation track's code; an old Pieces code is refused by name), and Install to AC / See it in Assetto: the install
    // is the Export button's own build with the same road surface (shell.buildExport), and the launch is off by default (src-tauri/src/ac.rs)
    const b64files = (files) => files.map((f) => ({ path: f.path, data: b64(f.bytes) }));
    const native = {
      getAcRoot: () => call('get_ac_root'), setAcRoot: (path) => call('set_ac_root', { path }), findAcRoot: () => call('find_ac_root'),
      installTrack: (folder, files) => call('install_track', { folder, files: b64files(files) }),
      getSeeItSetting: () => (tauri ? call('get_see_it_setting') : Promise.resolve(false)), setSeeItSetting: (on) => call('set_see_it_setting', { on }),
      seeIt: (track, layout) => call('see_it_in_assetto', { track, layout }),
    };
    const pickFolder = (title) => call('plugin:dialog|open', { options: { directory: true, multiple: false, title } });
    await panels.mountPanel($('share'), 'share', () => loadCjs('app/share/index.js', get, coreOpts), shell);
    await panels.mountPanel($('install'), 'install', () => loadCjs('app/install/index.js', get).then((m) => ({ mount: (root, sh) => m.mount(root, sh, { native, pickFolder, getTextures: () => textureSet, more: $('more-install'), card: setupSlot, testButton: $('testexport') }) })), shell);
    await panels.mountPanel($('guide'), 'onboarding', () => loadCjs('app/onboarding/index.js', get), shell);
    // D355: THE MENUS (app/menubar/). File, Edit, View and Settings are this page's; Build, Track, File ▸ Developer and Edit's selection entries are the parts'
    // modules (contract M: items(ctx)), each loaded on its own: one that is not there yet, or fails, gives its menu a placeholder and the rest still work
    try {
      const MB = await loadCjs('app/menubar/menubar.js', get), MI = await loadCjs('app/menubar/items.js', get), settings = await loadCjs('app/settings.js', get);
      const FR = await loadCjs('app/onboarding/firstrun.js', get);
      // D356: a part that fails to load KEEPS ITS REASON: Build and Track then say "This menu could not be built: <reason>" (menubar.js), and Edit's selection and
      // File ▸ Developer each say what could not be built under the page's own entries, which still work. Never a silent menu, never a placeholder
      const part = async (file, name) => { try { const m = await loadCjs(file, get); if (typeof m[name] !== 'function') throw new Error(`${file} exports no ${name}(ctx)`); return { fn: m[name] }; } catch (e) { return { error: (e && e.message) || String(e) }; } };
      const whole = (p) => (c) => { if (p.error) throw new Error(p.error); return p.fn(c); };
      const some = (p, what) => (c) => (p.error ? [{ label: `${what} could not be built: ${p.error}`, disabled: true, run: () => {} }] : p.fn(c));
      // (Track and File ▸ Developer use the trackmenu loaded above: ITS road-surface controller is the one alive, and a second load would make another)
      const build = await part('app/core/buildmenu.js', 'items'), selection = await part('app/core/piecesui.js', 'items');
      const fromTM = (name) => (TM && typeof TM[name] === 'function' ? { fn: TM[name] } : { error: tmError || `app/core/trackmenu.js exports no ${name}(ctx)` });
      const track = fromTM('items'), developer = fromTM('developerItems');
      const ctx = { doc: document, win: window, document, window, shell, settings, say: (t) => { status.textContent = t; },   // (A's trackmenu reads document and window)
        resetGuide: () => { FR.firstRun(FR.webStore(window)).forget(); status.textContent = 'The guide will open by itself at the next start.'; } };
      const { acFolder, acAllow } = MI.acNodes($('more-install')), soundRow = $('sound-row'), authorRow = MI.authorField(document, settings);   // D365
      $('m-settings-slot').append(...[acFolder, acAllow].filter(Boolean));   // in Settings from the start, not only once Settings has been opened
      MB.mountBar(document, [
        { details: $('m-file'), slot: $('m-file-slot'), items: (c) => MI.fileItems(c, { developer: some(developer, 'Developer ▸ Open example…')(c) }), closers: [$('new'), $('save'), $('export'), $('exportlayouts'), $('testexport'), $('open'), $('versions')] },
        { details: $('m-edit'), slot: $('m-edit-slot'), items: (c) => MI.editItems(c, { selection: some(selection, 'The selection\'s entries')(c) }) },
        { details: $('m-build'), slot: $('m-build-slot'), items: whole(build) },
        { details: $('m-track'), slot: $('m-track-slot'), items: whole(track) },
        { details: $('pieces') },
        { details: $('m-view'), slot: $('m-view-slot'), items: (c) => MI.viewItems(c) },
        { details: $('m-settings'), slot: $('m-settings-slot'), items: (c) => MI.settingsItems(c, { soundRow, acFolder, acAllow, authorRow }) },
      ], ctx);
      document.documentElement.dataset.menubar = 'ready';   // the page test waits for this
    } catch (e) { console.error(`the menus could not start: ${e && e.message}`); }
  }

})();
</script>
</body>
</html>
