[package]
name = "t180-track-builder"
version = "0.1.0"
description = "T-180 Track Builder: write an Assetto Corsa track in words, fonts and tempo"
authors = ["solariz3d"]
edition = "2021"

[lib]
name = "t180_track_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The same two crates blackbox builds on (blackbox/src-tauri/Cargo.toml), and nothing else: the native side only
# reads and writes named files in the app's data folder.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
